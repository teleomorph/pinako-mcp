[package]
name = "pinako-installer"
version = "1.1.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri      = { version = "2", features = [] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
dirs       = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# The embedded service binary is ~90 MB; codegen of a payload that size makes
# rustc/LLVM memory-hungry (observed OOM at opt-level 3 always, and at 1 under
# ambient memory pressure). codegen-units = 1 keeps it to a single LLVM
# instance instead of up to 16 in parallel. The installer is I/O-bound —
# neither optimization level nor compile parallelism matters for it.
[profile.release]
opt-level = 1
codegen-units = 1
